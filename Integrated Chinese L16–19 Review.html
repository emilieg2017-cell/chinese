<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrated Chinese L16–19 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F2; --card:#FFFFFF; --ink:#1E2B2F; --soft:#5B6B6E; --line:#D7DFD9;
  --grid:#3F8A6E; --gridf:rgba(63,138,110,.28); --gridbg:rgba(63,138,110,.07);
  --ok:#2F7D5B; --okbg:#E3F1EA; --bad:#B8362E; --badbg:#F8E5E3; --star:#C99316; --starbg:#FBF1D6;
  --hz:"Noto Serif SC","Songti SC","SimSun",serif;
  --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A1C; --card:#1B2427; --ink:#E3EBE7; --soft:#9AAAA6; --line:#2E3B3E;
    --grid:#6CB99B; --gridf:rgba(108,185,155,.25); --gridbg:rgba(108,185,155,.07);
    --ok:#6CC79C; --okbg:#1D3A2E; --bad:#F08A80; --badbg:#3E2220; --star:#E4B84A; --starbg:#3A3017;
  }
}
:root[data-theme="dark"]{
  --paper:#131A1C; --card:#1B2427; --ink:#E3EBE7; --soft:#9AAAA6; --line:#2E3B3E;
  --grid:#6CB99B; --gridf:rgba(108,185,155,.25); --gridbg:rgba(108,185,155,.07);
  --ok:#6CC79C; --okbg:#1D3A2E; --bad:#F08A80; --badbg:#3E2220; --star:#E4B84A; --starbg:#3A3017;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.55;min-height:100%}
.hz{font-family:var(--hz)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav.rail{position:sticky;top:0;align-self:start;height:100vh;padding:28px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;gap:4px;margin:0 8px 22px}
.brand .cell{width:40px;height:40px;font-size:26px}
nav.rail button{display:flex;align-items:baseline;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;color:var(--soft)}
nav.rail button .zh{font-family:var(--hz);font-size:17px;color:var(--ink);min-width:2.2em}
nav.rail button:hover{background:var(--gridbg)}
nav.rail button[aria-current="true"]{background:var(--gridbg);color:var(--ink);box-shadow:inset 3px 0 0 var(--grid)}
nav.rail .count{margin-left:auto;font-size:13px;background:var(--badbg);color:var(--bad);border-radius:10px;padding:0 7px}
.theme-btn{margin-top:auto !important;font-size:14px}
main{padding:40px clamp(18px,4vw,56px) 80px;max-width:900px;width:100%}
h1{font-size:30px;line-height:1.2;margin:0 0 6px;font-weight:700}
h2{font-size:22px;margin:34px 0 10px}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 12px}
.lead{color:var(--soft);margin-bottom:24px;max-width:62ch}
.muted{color:var(--soft)}
.small{font-size:14px}

/* tianzige cell */
.cell{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--grid);font-family:var(--hz);color:var(--ink);
  background:
   linear-gradient(to right,transparent calc(50% - .5px),var(--gridf) calc(50% - .5px),var(--gridf) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(to bottom,transparent calc(50% - .5px),var(--gridf) calc(50% - .5px),var(--gridf) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(45deg,transparent calc(50% - .6px),var(--gridf) calc(50% - .6px),var(--gridf) calc(50% + .6px),transparent calc(50% + .6px)),
   linear-gradient(-45deg,transparent calc(50% - .6px),var(--gridf) calc(50% - .6px),var(--gridf) calc(50% + .6px),transparent calc(50% + .6px)),
   var(--card)}
.cells{display:inline-flex}
.cells .cell+.cell{border-left:0}
.hero{display:flex;flex-wrap:wrap;gap:0;margin:6px 0 18px}
.hero .cell{width:clamp(58px,11vw,92px);height:clamp(58px,11vw,92px);font-size:clamp(38px,7.5vw,64px);font-weight:600}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:7px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--card);padding:5px 12px;border-radius:999px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--grid);background:var(--gridbg);color:var(--ink);font-weight:700}
.statline{display:flex;flex-wrap:wrap;gap:28px;margin:4px 0 6px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--soft);font-size:14px}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.lesson{display:flex;flex-direction:column;justify-content:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left}
.lesson:hover{border-color:var(--grid)}
.lesson .t{font-family:var(--hz);font-size:22px;font-weight:600}
.lesson .s{color:var(--soft);font-size:14px}

/* quiz */
.qwrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.progress{height:6px;background:var(--gridbg);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--grid);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--soft)}
.qprompt{font-size:22px;line-height:1.7;margin:4px 0 6px}
.qprompt.zh{font-family:var(--hz)}
.qctx{color:var(--soft);font-size:15px;margin-bottom:12px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--grid);margin:0 3px;transform:translateY(-4px)}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:11px 14px;font-size:18px}
.opt .k{font-size:13px;color:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-top:3px}
.opt .v{font-family:var(--hz)}
.opt:hover:not(:disabled){border-color:var(--grid)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;padding:13px 16px;border-radius:8px;font-size:16px}
.feedback.ok{background:var(--okbg)}
.feedback.bad{background:var(--badbg)}
.feedback b{display:block;margin-bottom:2px}
.feedback .zh{font-family:var(--hz);font-size:19px}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.slots{min-height:56px;border:1.5px dashed var(--grid);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}
.slots.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slots.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.bank{display:flex;flex-wrap:wrap;gap:7px}
.tile{font-family:var(--hz);font-size:19px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 11px}
.tile:hover{border-color:var(--grid)}
.tile.used{visibility:hidden}
.pre{font-family:var(--hz);font-size:19px}
textarea,input[type=text]{width:100%;font-family:var(--hz);font-size:20px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
textarea{min-height:80px;resize:vertical}

/* grammar */
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.gcard summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:baseline;gap:12px}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary .gt{font-family:var(--hz);font-size:20px;font-weight:600}
.gcard summary .ge{color:var(--soft);font-size:15px}
.gcard summary::after{content:"+";margin-left:auto;color:var(--grid);font-size:22px;line-height:1}
.gcard[open] summary::after{content:"–"}
.gbody{padding:0 20px 18px}
.struct{font-family:var(--hz);font-size:18px;background:var(--gridbg);border-left:3px solid var(--grid);padding:10px 14px;border-radius:0 6px 6px 0;margin:4px 0 12px}
.ex{margin:0 0 9px}
.ex .zh{font-family:var(--hz);font-size:19px;display:block}
.ex .en{color:var(--soft);font-size:15px}
.pit{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--hz);font-size:17px;margin:10px 0}
.pit .y{color:var(--ok)} .pit .n{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
table.dir{border-collapse:collapse;font-family:var(--hz);margin:8px 0 14px;font-size:17px}
.tablewrap{overflow-x:auto}
table.dir td,table.dir th{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.dir th{font-family:var(--ui);font-size:14px;color:var(--soft);font-weight:400}

/* flashcards */
.fc{perspective:1200px;margin:10px 0 14px}
.fc-in{position:relative;min-height:290px;border-radius:12px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-face .big{font-family:var(--hz);font-size:clamp(40px,9vw,70px);font-weight:600;line-height:1.2}
.fc-face .py{font-size:24px;margin-top:8px}
.fc-face .en{font-size:20px;color:var(--soft);margin-top:4px}
.badge{display:inline-block;font-size:13px;padding:1px 8px;border-radius:10px;background:var(--gridbg);color:var(--soft)}
.badge.star{background:var(--starbg);color:var(--star);font-weight:700}
@media (prefers-reduced-motion: reduce){.fc-in,.progress i{transition:none}}

.vlist{width:100%;border-collapse:collapse}
.vlist td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vlist td.h{font-family:var(--hz);font-size:19px;white-space:nowrap}
.vlist td.p{color:var(--soft);white-space:nowrap}

/* reading */
.passage{font-family:var(--hz);font-size:20px;line-height:2;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:14px}
.passage p{margin:0 0 10px;text-indent:2em}
.trans{font-size:16px;color:var(--soft);background:var(--gridbg);padding:14px 18px;border-radius:8px;margin-bottom:14px}

/* writing */
.canvaswrap{position:relative;display:inline-block;touch-action:none;margin:12px 0}
.canvaswrap canvas{display:block;border-radius:2px}
.overlay{position:absolute;inset:0;display:flex;pointer-events:none}
.overlay span{display:flex;align-items:center;justify-content:center;font-family:var(--hz);color:var(--grid);opacity:.38}

.summary-list{list-style:none;padding:0;margin:0}
.summary-list li{border-top:1px solid var(--line);padding:12px 0}
.summary-list .zh{font-family:var(--hz);font-size:18px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar .lbl{width:120px;font-size:14px;color:var(--soft)}
.bar .track{flex:1;height:10px;background:var(--gridbg);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--grid)}
.bar .val{width:52px;text-align:right;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--soft);border:1.5px dashed var(--line);border-radius:10px}
.kbd{font-size:13px;color:var(--soft)}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.rail{position:sticky;top:0;height:auto;flex-direction:row;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--paper);z-index:5;gap:4px}
  .brand{display:none}
  nav.rail button{flex-direction:column;align-items:center;gap:0;padding:6px 10px;white-space:nowrap;font-size:12px}
  nav.rail button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--grid)}
  nav.rail .count{margin:0;font-size:11px}
  .theme-btn{margin-top:0 !important}
  main{padding-top:24px}
  .qprompt{font-size:20px}
}
</style>
</head>

const VOCAB=VOCAB_RAW.map((v,i)=>({id:'v'+i,h:v[0],p:v[1],e:v[2],L:v[3],star:v[4]||0}));

/* Grammar cards */
const DIRTABLE=`<div class="tablewrap"><table class="dir"><tr><th></th><th>上 up</th><th>下 down</th><th>进 in</th><th>出 out</th><th>回 back</th><th>过 across</th><th>起 up</th></tr>
<tr><th>来 toward</th><td>上来</td><td>下来</td><td>进来</td><td>出来</td><td>回来</td><td>过来</td><td>起来</td></tr>
<tr><th>去 away</th><td>上去</td><td>下去</td><td>进去</td><td>出去</td><td>回去</td><td>过去</td><td>—</td></tr></table></div>`;
const GRAMMAR=[
{id:'g16_tongyi',L:16,t:'同一 vs. 一样',e:'the same',s:'同一 + MW + N　｜　一样的 + N　｜　A 跟 B 一样 + Adj.',n:'Before a noun, 同一 must take a measure word, while 一样 must take 的. 一样 can also be a predicate or appear in a comparison.',ex:[['她们俩在同一个学校学习。','They study at the same school.'],['她们俩穿一样的衣服。','They wear identical clothes.'],['我和她一样，都喜欢喝茶。','She and I are alike: we both like tea.'],['这本书跟那本书一样贵。','This book is as expensive as that one.']],pit:[['同一个学校','同一学校的'],['一样的衣服','一样衣服']]},
{id:'g16_kuai',L:16,t:'快 + duration + 了',e:'almost (a length of time)',s:'(已经) 快 + time duration + 了',n:'Indicates that an amount of time is approaching a certain point.',ex:[['他们认识已经快半年了。','They have known each other for almost half a year.']]},
{id:'g16_yinxiang',L:16,t:'对……的印象',e:'impression of',s:'A + 对 + B + (的)印象 + Adj.　=　B + 给 + A + (的)印象 + Adj.',n:'Both patterns mean the same thing; swap A and B when switching between 对 and 给. The adjective is an evaluation such as 很好、不好、不错, never something unrelated like 漂亮. For a specific impression: A 对 B 的印象是 + clause.',ex:[['李友对王朋的印象很好。','Li You has a very good impression of Wang Peng.'],['王朋给李友的印象很好。','Wang Peng made a very good impression on Li You.']],pit:[['印象很好','印象很漂亮']]},
{id:'g16_feili',L:16,t:'费了……才……',e:'only after a lot of effort',s:'S + 费了很大的力气 + 才 + V(result)',n:'Something was achieved only after spending considerable time or effort. 才 marks the late or difficult achievement.',ex:[['王朋费了很大的力气才买到票。','Wang Peng got the tickets only after a lot of effort.']]},
{id:'g16_jide',L:16,t:'记得 vs. 想起来',e:'remember vs. recall',s:'记得 = state of remembering　｜　想起来 = act of retrieving　→　不记得 / 想不起来',n:'记得 focuses on what is remembered; 想起来 focuses on the process of calling something back to mind. Their negatives are 不记得 and 想不起来.',ex:[['我记得今天下午要开会，可是我想不起来在哪儿开会。','I remember there\u2019s a meeting this afternoon, but I can\u2019t recall where.'],['李友不记得费先生了。','Li You doesn\u2019t remember Mr. Fei.']]},
{id:'g16_haohaor',L:16,t:'好好儿 + V',e:'properly, to one\u2019s heart\u2019s content',s:'好好儿 + V (+ V)',n:'Emphasizes doing something carefully, properly, or to one\u2019s satisfaction.',ex:[['这个周末我要好好儿玩儿玩儿。','This weekend I\u2019m going to really have fun.']]},
{id:'g16_desc',L:16,t:'Descriptive complements',e:'how an action is done',s:'S + V + (O + V) + 得 + complement',n:'If the verb has an object, repeat the verb before 得. For the negative, replace 很 with 不.',ex:[['李友跳舞跳得不错。','Li You dances pretty well.'],['他写汉字写得很快。','He writes characters quickly.'],['昨天我打球打得很累。','Yesterday I played ball until I was tired.']],pit:[['写汉字写得很快','写汉字得很快'],['写得不快','不写得快']]},
{id:'g16_pot',L:16,t:'Potential complements',e:'can / can\u2019t achieve a result',s:'V + 得 + complement　｜　V + 不 + complement',n:'To say a result can\u2019t be achieved, use the potential complement, not 不能 + V + complement. Common forms: 吃/看/做/写 得完 不完; 看/听 得懂 不懂; 买/找/看/听/做 得到 不到.',ex:[['这些菜太多了，我吃不完。','There\u2019s too much food; I can\u2019t finish it.'],['今天的功课我一个小时做不完。','I can\u2019t finish today\u2019s homework in an hour.'],['你看得懂看不懂中文电影？','Can you understand Chinese movies?']],pit:[['听不懂','不能听懂'],['吃不完','吃得不完']]},
{id:'g16_dir',L:16,t:'Directional complements',e:'direction of movement',s:'V + 上/下/进/出/回/过/起 + 来/去　｜　把 + O + V + 进/出… (+ place) + 来/去',n:'The first part shows the direction; 来 means toward the speaker, 去 away from the speaker. A place word goes between the two parts.',x:DIRTABLE,ex:[['我把书带来了。','I brought the book (here).'],['请把床搬进房间去。','Please move the bed into the room.'],['老师走进教室来。','The teacher walked into the classroom (toward me).'],['我要从宿舍搬出去。','I want to move out of the dorm.']],pit:[['搬进房间去','搬进去房间']]},
{id:'g16_jiu',L:16,t:'就 = only',e:'only',s:'就 + noun / pronoun',n:'Before a noun or pronoun, 就 can mean \u201conly\u201d (只有). English \u201conly\u201d in translations can often be 就.',ex:[['我们都不喜欢他，就你喜欢他！','None of us like him; only you do!'],['那个饭馆儿就两个菜好吃。','At that restaurant only two dishes are good.']]},

{id:'g17_twole',L:17,t:'V 了 + duration + 了',e:'has been doing (and still is)',s:'S + V(O V) + 了 + duration + 了',n:'With two 了, the action has lasted this long and is still going. With an object, repeat the verb. With only the first 了, the action is finished: 她病了三天 (she was sick for three days).',ex:[['我在这套公寓住了差不多两年了。','I\u2019ve lived in this apartment for almost two years.'],['我们看电影看了一个小时了。','We\u2019ve been watching the movie for an hour.'],['王朋在学校的宿舍住了两个学期了。','Wang Peng has lived in the dorm for two semesters.']]},
{id:'g17_lian',L:17,t:'连……都/也……',e:'even',s:'连 + N (extreme example) + 都/也 + V',n:'Emphasizes an extreme or unexpected example. The object moves in front of the verb.',ex:[['小李的中文不好，连"天"都不会写。','Little Li\u2019s Chinese is poor; he can\u2019t even write 天.'],['学校的宿舍连厨房都没有。','The dorm doesn\u2019t even have a kitchen.']],pit:[['连"天"都不会写','不会写连"天"都']]},
{id:'g17_xia',L:17,t:'V 得下 / V 不下',e:'enough room for',s:'坐/放/住 + 得下 / 不下 + sb/sth',n:'Whether a place or container has room. Match the verb: 坐 for seating people, 放 for putting things, 住 for housing people. Combines with 连……都/也.',ex:[['我的桌子很大，放得下两个电脑。','My desk is big; it can fit two computers.'],['这套沙发坐不下三个人。','This sofa can\u2019t seat three people.'],['我的厨房很小，连冰箱都放不下。','My kitchen is tiny; it can\u2019t even fit a fridge.']]},
{id:'g17_heshi',L:17,t:'对……合适',e:'suitable for',s:'S + 对 + person + (不)合适',n:'Says whether something is a good fit for someone.',ex:[['这套公寓对学生很合适。','This apartment suits students well.'],['这儿不准养宠物，对我们不合适。','No pets allowed here, so it doesn\u2019t suit us.']]},
{id:'g17_duo',L:17,t:'多 for approximate numbers',e:'more than, …-odd',s:'Num + 多 + MW (10s)　｜　Num + MW + 多 (divisible units)',n:'If the unit can\u2019t be divided, 多 precedes the measure word: 十多个学生. If the unit can be divided and the number isn\u2019t a multiple of 10, 多 follows: 六块多钱、四个多星期. With multiples of 10 either works, but the range differs: 十多块钱 = 10–20, 十块多钱 = 10–11.',ex:[['中文课有十多个学生。','The Chinese class has ten-odd students.'],['我学中文学了一年多了。','I\u2019ve been studying Chinese for over a year.']]},
{id:'g17_youyidianr',L:17,t:'有一点儿 + Adj. vs. Adj. + 一点儿',e:'a bit too… / a bit more…',s:'有一点儿 + Adj. (complaint)　｜　有没有 / 能不能 + Adj. + 一点儿 (request)',n:'有一点儿 + Adj. describes something slightly unsatisfactory. Adj. + 一点儿 asks for a change. Use 有没有 to ask if another option exists; use 能不能 to ask someone to change something.',ex:[['这双鞋有一点儿大，有没有小一点儿的？','These shoes are a bit big; do you have smaller ones?'],['房租有一点儿贵，能不能便宜一点儿？','The rent is a bit high; could it be cheaper?'],['老师，您说得有一点儿快，可以慢一点儿吗？','Teacher, you\u2019re speaking a bit fast; could you slow down?']],pit:[['有一点儿贵','贵有一点儿']]},
{id:'g17_qp',L:17,t:'Question pronoun + 都/也',e:'everything / nothing / everyone / no one',s:'(N) + QP (+ MW) + 都/也 + (不/没) + VP',n:'什么、谁、哪儿 take no measure word. After a plural noun, 哪 takes the right measure word (这些人 → 哪个；那些书 → 哪本). Use 不 for present or future, 没 for past or completed actions.',ex:[['小白什么书都爱看。','Xiao Bai loves reading all kinds of books.'],['在那个班，我谁都不认识。','I don\u2019t know anyone in that class.'],['中国我哪儿都没去过。','I haven\u2019t been anywhere in China.'],['那些书他哪本都看过。','He\u2019s read every one of those books.']]},
{id:'g17_xingqu',L:17,t:'对……有/没兴趣',e:'(not) interested in',s:'S + 对 + N/VP + (很)有兴趣 / 没(有)兴趣',n:'Expresses interest or lack of interest.',ex:[['我对中国电影很有兴趣。','I\u2019m very interested in Chinese movies.'],['高文中对运动没有兴趣，所以越来越胖了。','Gao Wenzhong isn\u2019t interested in exercise, so he keeps getting heavier.']]},
{id:'g17_lingwai',L:17,t:'另外',e:'in addition',s:'Sentence 1。另外，sentence 2。',n:'Adds one more piece of information, usually at the start of a new clause or sentence.',ex:[['这套公寓很便宜。另外，你也不用付水电费。','This apartment is cheap. Also, you don\u2019t pay utilities.'],['要多付一个月的房租当押金，另外，我们公寓不准养宠物。','You pay an extra month as a deposit; also, no pets.']]},
{id:'g17_words',L:17,t:'附近・带・差不多・不准',e:'useful apartment words',s:'Place + 附近　｜　带家具　｜　差不多 + amount　｜　不准 + V',n:'附近 = in the vicinity of; 带 = comes with/includes; 差不多 = about, almost; 不准 = not permitted.',ex:[['学校附近有很多外国饭馆。','There are many foreign restaurants near the school.'],['这套公寓不带家具。','This apartment isn\u2019t furnished.'],['房租加水电费差不多八百美元。','Rent plus utilities is about $800.']]},

{id:'g18_yuelaiyue',L:18,t:'越来越 + Adj.',e:'more and more',s:'S + 越来越 + Adj. (+ 了)',n:'Something is becoming more and more a certain way. Don\u2019t add 很.',ex:[['你平常吃得那么多，又不运动，当然越来越胖了。','You eat so much and don\u2019t exercise — of course you\u2019re getting heavier.']],pit:[['越来越胖','越来越很胖']]},
{id:'g18_freq',L:18,t:'Frequency with 次',e:'how often',s:'S + time period + V + number + 次 (+ O)',n:'The time period sets the interval; 次 counts. With an object, number + 次 goes between the verb and the object.',ex:[['我一个星期打三次网球。','I play tennis three times a week.'],['她一个月去两次健身房。','She goes to the gym twice a month.'],['我一个星期运动两三次。','I exercise two or three times a week.']],pit:[['一个月打两次网球','一个月打网球两次']]},
{id:'g18_duration',L:18,t:'Duration of an activity',e:'for how long',s:'S + V + O + V + duration　｜　S + V + duration + (的) + O',n:'With verb–object words like 跑步, 游泳, 睡觉, repeat the verb or put the duration between verb and object. No 了 = habit or plan; V了 = past event; V了…了 = still continuing.',ex:[['我每天跑步跑一个小时。','I run for an hour every day.'],['我明天想游半个小时的泳。','Tomorrow I want to swim for half an hour.'],['我昨天跑步跑了一个小时。','I ran for an hour yesterday.'],['我已经跑步跑了一个小时了，还想再跑十分钟。','I\u2019ve been running for an hour and want ten more minutes.']]},
{id:'g18_inactive',L:18,t:'Duration + 没……了',e:'haven\u2019t done for…',s:'S + duration + 没 + VP + 了',n:'How long someone has gone without doing something. The duration goes before 没, and don\u2019t forget the final 了.',ex:[['我两个星期没游泳了。','I haven\u2019t swum in two weeks.'],['我四年多没回中国了。','I haven\u2019t been back to China for over four years.']],pit:[['两个星期没游泳了','没游泳两个星期了']]},
{id:'g18_yue',L:18,t:'约・好/难 + V',e:'arrange with; easy/hard to',s:'约 + sb + V　｜　好/难 + V',n:'约 arranges plans with someone. 好 + V and 难 + V describe whether something is easy/pleasant or difficult to do: 好吃, 难写, 好听.',ex:[['这个周末我约了人打篮球。','This weekend I made plans with someone to play basketball.'],['这个汉字很难写。','This character is hard to write.']]},
{id:'g18_xiaqu',L:18,t:'V/Adj. + 下去',e:'keep on, continue',s:'S + V/Adj. + 下去　｜　S + 把 + O + V + 下去',n:'下去 here means continuing into the future, not moving down. When there is an object, use the 把 pattern.',ex:[['中文很有意思，我要学下去。','Chinese is interesting; I\u2019ll keep studying it.'],['我想把中文学下去。','I want to keep studying Chinese.'],['如果天气一直冷下去，我们就不去打网球了。','If it stays cold, we won\u2019t play tennis.']],pit:[['把功课做下去','做功课下去']]},
{id:'g18_zhe',L:18,t:'V₁ 着 (O) + V₂',e:'doing one thing while doing another',s:'S + V₁ + 着 (+ O₁) + V₂ (+ O₂)',n:'V₁ is a continuing posture, state, or background activity; V₂ is the main action. 着 (zhe) follows V₁, before its object.',ex:[['我喜欢躺着听音乐。','I like to listen to music lying down.'],['她坐着跟朋友聊天儿。','She chats with friends sitting down.'],['打着电话开车很危险。','Driving while on the phone is dangerous.']],pit:[['听着音乐做功课','听音乐着做功课']]},
{id:'g18_weile',L:18,t:'为了……，……',e:'in order to',s:'为了 + goal, S + action',n:'Introduces the purpose of an action. Put 不 inside the goal to avoid something. Don\u2019t confuse with 因为, which gives a cause.',ex:[['为了提高中文水平，我每天都看中文电视。','To raise my Chinese level, I watch Chinese TV every day.'],['为了不迟到，她早上七点就出门了。','So as not to be late, she left at seven.']]},
{id:'g18_haishi',L:18,t:'还是……吧',e:'had better…',s:'(rejected option), 还是 + alternative + 吧',n:'Suggests choosing another option, often after turning down the first.',ex:[['我看不懂美式足球，还是看别的吧。','I don\u2019t understand American football; let\u2019s watch something else.']]},
{id:'g18_bei',L:18,t:'被 / 叫 / 让 passives',e:'passive voice',s:'Receiver + 被 (+ agent) + V + result　｜　Receiver + 叫/让 + agent + V + result',n:'Used when the affected person or thing is the topic, often for unwelcome events. Don\u2019t end on a bare verb. With 叫/让 an agent is required; use 人 if unknown. Compare: 我的书被弟弟拿走了 (about the book) vs. 弟弟把我的书拿走了 (about what the brother did).',ex:[['我的信用卡被人拿走了。','My credit card was taken.'],['我的网球拍被弟弟压坏了。','My racket got crushed by my little brother.'],['我的自行车叫人骑走了。','Someone rode off on my bike.'],['昨晚旁边宿舍的人开舞会，我被吵死了。','The dorm next door had a party last night; the noise drove me crazy.']],pit:[['被弟弟拿走了','被弟弟拿']]},

{id:'g19_youde',L:19,t:'有的……，有的……',e:'some…, others…',s:'(group), 有的 + VP，有的 + VP',n:'Describes different members of the same group.',ex:[['我们的同学，有的去暑期班学习，有的去公司实习。','Of our classmates, some are taking summer classes and some are interning.']]},
{id:'g19_yaoshi',L:19,t:'要是……就好了',e:'if only…; it would be great if…',s:'要是 + wish + 就好了',n:'Expresses a wish or hope.',ex:[['听说北京的秋天特别漂亮，要是能秋天去北京就好了。','I hear Beijing is beautiful in autumn; it\u2019d be great to go then.']]},
{id:'g19_budeliao',L:19,t:'Adj. + 得不得了',e:'extremely',s:'S + Adj. + 得 + 不得了',n:'A strong reaction with no comparison standard. Don\u2019t add 很 or 非常. For a difference between two things, use 比 … 得多/多了 instead.',ex:[['现在的国际机票贵得不得了。','International tickets are terribly expensive now.'],['跑了一个小时以后，我累得不得了。','After running an hour, I was exhausted.']],pit:[['累得不得了','很累得不得了']]},
{id:'g19_bi',L:19,t:'Comparisons with 比',e:'A is more … than B',s:'A + 比 + B + Adj. (+ 一点儿 / 得多 / 多了 / exact amount)',n:'一点儿 = a little; 得多 or 多了 = much; a number + unit = exact difference. Never put 很 before the adjective.',ex:[['这张机票比那张贵一点儿，但是飞行时间短得多。','This ticket is slightly pricier but the flight is much shorter.'],['我哥哥比我大五岁。','My brother is five years older than me.'],['我的房租比你的便宜五百块钱。','My rent is 500 cheaper than yours.']],pit:[['比我大五岁','比我很大']]},
{id:'g19_dazhe',L:19,t:'打折',e:'discounts',s:'Item + 打 + number + 折',n:'The number is the share you PAY. 九折 = pay 90% (10% off); 八折 = 20% off; 七五折 = 25% off; 五折 = half price. Say 八折, not 八十折.',ex:[['这件衬衫打八折，原价一百块，现在八十块。','The shirt is 20% off: 100 originally, now 80.'],['这张机票打七五折，原价八百块，现在六百块。','The ticket is 25% off: 800 originally, now 600.']]},
{id:'g19_numbers',L:19,t:'Large numbers: 万 and 亿',e:'over 1,000',s:'亿 group + 万 group + last four digits',n:'Group digits in fours from the right. 万 = 10,000; 亿 = 100,000,000. Use one 零 for each gap, not one per zero. Anchors: 十万 = 100,000; 一百万 = 1,000,000; 一千万 = 10,000,000; 十亿 = 1,000,000,000.',ex:[['50,740 → 五万零七百四十','5 × 10,000 + 740'],['273,608 → 二十七万三千六百零八','27 × 10,000 + 3,608'],['3,409,000,830 → 三十四亿零九百万零八百三十','34 亿 + 900 万 + 830']]},
{id:'g19_na',L:19,t:'哪 + MW + N',e:'which',s:'哪 + measure word + noun',n:'Asks someone to select from a set. Use 家 for businesses, 张 for tickets, 个 for people and places. 哪儿 means \u201cwhere\u201d and takes no measure word.',ex:[['你想坐哪家航空公司的飞机？','Which airline do you want to fly?'],['你想买哪张机票？','Which ticket do you want to buy?']]},
{id:'g19_qpref',L:19,t:'Question word…就…same question word',e:'whatever / wherever / whichever',s:'(S₁) + … QW，(S₂) + 就 + … + same QW',n:'The first question word sets an open choice; the repeated one refers back to that choice. 就 links them. The verbs may differ, but the question word must match.',ex:[['你想吃什么，就点什么。','Order whatever you want to eat.'],['你吃什么，我就吃什么。','I\u2019ll eat whatever you eat.'],['哪家航空公司的票便宜，我就买哪家的。','I\u2019ll buy from whichever airline is cheapest.'],['你想买什么，我就给你买什么。','I\u2019ll buy you whatever you want.']]},
{id:'g19_words',L:19,t:'订・办・马上・赶快・初/末',e:'travel planning words',s:'订 + ticket/room　｜　办 + 签证/护照　｜　马上 / 赶快 + V　｜　month + 初/末',n:'订 = book or reserve; 办 = handle paperwork; 马上 = immediately; 赶快 = hurry up and…; 六月初 = early June, 六月末 = late June.',ex:[['我要给旅行社打电话订飞机票。','I need to call the travel agency to book a plane ticket.'],['我得马上去教室上课。','I have to go to class right now.']]},

{id:'g15',L:15,t:'Structures from earlier lessons',e:'foundations L1–15',s:'的 / 得 / 地　｜　过　｜　把　｜　是……的　｜　再 / 又　｜　还是 / 或者　｜　一边……一边　｜　除了……以外',n:'These show up throughout Lessons 16–19, so mistakes here cost points everywhere: 的 before nouns, 得 after verbs for complements, 地 before verbs; 过 for past experience; 把 + object + verb + something; 是……的 for details of a past event; 再 for future repetition, 又 for past repetition; 还是 in questions, 或者 in statements.',ex:[['他跑得很快。','He runs fast.'],['我去过中国。','I\u2019ve been to China.'],['我是坐飞机来的。','I came by plane.'],['你喝茶还是喝咖啡？','Tea or coffee?']]}
];

/* Question bank: first option is correct (shuffled at display) */
const Q=[];
let qn=0;
function mc(L,g,prompt,opts,ex,ctx){Q.push({id:'m'+(qn++),kind:'mc',L,g,prompt,opts,ans:opts[0],ex,ctx})}
function od(L,g,en,chunks,pre,alts){Q.push({id:'o'+(qn++),kind:'order',L,g,en,chunks,pre:pre||'',alts:alts||[]})}
function tr(L,g,en,model,alts){Q.push({id:'t'+(qn++),kind:'trans',L,g,en,model,alts:alts||[]})}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=(a,n)=>shuffle(a).slice(0,n);

/* ================= NUMBERS ================= */
const DG='零一二三四五六七八九';
function grp(n,leading){
  const ds=[Math.floor(n/1000),Math.floor(n/100)%10,Math.floor(n/10)%10,n%10],U=['千','百','十',''];
  let s='',zero=false,started=false;
  for(let i=0;i<4;i++){const d=ds[i];
    if(d===0){if(started)zero=true;continue}
    if(zero){s+='零';zero=false}
    let c=DG[d]; if(i===0&&d===2)c='两'; if(i===2&&d===1&&!started&&leading)c='';
    s+=c+U[i];started=true}
  return s}
function numToZh(n){
  if(n===0)return'零';
  const g=[Math.floor(n/1e8),Math.floor(n/1e4)%1e4,n%1e4],U=['亿','万',''];
  let s='',started=false,pz=false;
  for(let i=0;i<3;i++){const v=g[i];
    if(v===0){if(started)pz=true;continue}
    if(started&&(pz||v<1000))s+='零';
    let t=grp(v,!started); if(v===2&&i<2)t='两';
    s+=t+U[i];started=true;pz=false}
  return s}
function randNum(){const len=4+Math.floor(Math.random()*7);let s=''+(1+Math.floor(Math.random()*9));for(let i=1;i<len;i++)s+=Math.random()<.42?'0':Math.floor(Math.random()*10);return +s}
const fmt=n=>n.toLocaleString('en-US');
let genId=0;
function numQ(){
  const n=randNum();
  if(Math.random()<.55){
    const right=numToZh(n);const opts=new Set([right]);
    const alts=[n*10,Math.floor(n/10),n+Math.pow(10,Math.floor(Math.random()*String(n).length))];
    const noZero=right.replace(/零/g,''); if(noZero!==right)opts.add(noZero);
    for(const a of alts){if(opts.size>=4)break;if(a>0&&a!==n)opts.add(numToZh(a))}
    while(opts.size<4)opts.add(numToZh(randNum()));
    return{id:'n'+(genId++)+'_'+n,kind:'mc',L:19,g:'g19_numbers',prompt:fmt(n)+' =',opts:[...opts].slice(0,4),ans:right,ex:'Group by four digits from the right: '+fmt(n)+' → '+right}
  }
  return{id:'n'+(genId++)+'_'+n,kind:'type',L:19,g:'g19_numbers',prompt:numToZh(n)+' =',ans:String(n),ctx:'Type the number in digits (commas optional).',ex:numToZh(n)+' = '+fmt(n)}
}
const ZHE=[['九',.9],['八五',.85],['八',.8],['七五',.75],['七',.7],['六',.6],['五',.5]];
const PRICES=[100,200,300,400,500,600,800,1000,1200,1500,2000];
function zheQ(){
  const [z,r]=ZHE[Math.floor(Math.random()*ZHE.length)];const P=PRICES[Math.floor(Math.random()*PRICES.length)];
  const t=Math.random();
  if(t<.5){
    const right=Math.round(P*r);const opts=new Set([right,Math.round(P*(1-r))]);
    [Math.round(P*(r-.1)),Math.round(P*(r+.05)),Math.round(P*r/2),P-Math.round(r*10)].forEach(x=>{if(opts.size<4&&x>0)opts.add(x)});
    const o=[...opts].slice(0,4).map(x=>numToZh(x)+'块（'+fmt(x)+'）');
    return{id:'z'+(genId++),kind:'mc',L:19,g:'g19_dazhe',prompt:'原价'+numToZh(P)+'块，打'+z+'折。现在多少钱？',opts:o,ans:o[0],ex:'打'+z+'折 = pay '+Math.round(r*100)+'%: '+fmt(P)+' × '+r+' = '+fmt(right)+'.'}
  }
  if(t<.75){
    const pay=Math.round(r*100),off=100-pay;const o=['pay '+pay+'% ('+off+'% off)','pay '+off+'% ('+pay+'% off)',z+'% off','pay '+(pay/10)+'%'];
    return{id:'z'+(genId++),kind:'mc',L:19,g:'g19_dazhe',prompt:'打'+z+'折 means…',opts:o,ans:o[0],ex:'The number tells you the share you pay.'}
  }
  const pay=Math.round(r*100),off=100-pay;
  const wrongs=new Set();ZHE.forEach(([zz,rr])=>{if(zz!==z)wrongs.add('打'+zz+'折')});
  const o=['打'+z+'折',...pick([...wrongs],2),'打'+numToZh(off).replace(/^一十/,'十')+'折'];
  const uniq=[...new Set(o)].slice(0,4);
  return{id:'z'+(genId++),kind:'mc',L:19,g:'g19_dazhe',prompt:'How do you say \u201c'+off+'% off\u201d?',opts:uniq,ans:uniq[0],ex:off+'% off = you pay '+pay+'% → 打'+z+'折.'}
}

/* ================= QUIZ RUNNER ================= */
function runQuiz(host,items,opt={}){
  let i=0,score=0;const results=[];
  host.innerHTML='';
  const wrap=el('<div></div>');host.appendChild(wrap);
  if(opt.header) host.insertBefore(opt.header,wrap);
  function next(){ if(i>=items.length) return finish(); show(items[i]) }
  function show(q){
    wrap.innerHTML='';
    const box=el(`<div class="qwrap" role="group" aria-label="Question ${i+1} of ${items.length}"></div>`);
    box.appendChild(el(`<div class="qmeta"><span>${opt.title?esc(opt.title)+' · ':''}${i+1} / ${items.length}</span><span>${q.L?(LNAME[q.L]):''}</span></div>`));
    box.appendChild(el(`<div class="progress"><i style="width:${(i/items.length)*100}%"></i></div>`));
    wrap.appendChild(box);
    const done=(ok,html,auto)=>{
      results.push({q,ok}); if(ok)score++; record(q,ok);
      const fb=el(`<div class="feedback ${ok?'ok':'bad'}" aria-live="polite"><b>${ok?'Correct.':'Not quite.'}</b>${html||''}</div>`);
      box.appendChild(fb);
      const nb=el(`<div class="qnav"><button class="btn">${i+1<items.length?'Next question':'See results'}</button></div>`);
      box.appendChild(nb);const b=$('button',nb);b.onclick=()=>{i++;next()};b.focus({preventScroll:true});
    };
    if(q.ctx) box.appendChild(el(`<div class="qctx">${esc(q.ctx)}</div>`));
    if(q.kind==='mc'){
      const zh=hasHan(q.prompt);
      box.appendChild(el(`<div class="qprompt ${zh?'zh':''}" ${q.zhPrompt?'style="font-size:34px"':''}>${blankify(q.prompt)}</div>`));
      const opts=el('<div class="opts"></div>');box.appendChild(opts);
      const order=shuffle(q.opts);
      order.forEach((o,k)=>{
        const b=el(`<button class="opt"><span class="k">${k+1}</span><span class="${hasHan(o)?'v':''}">${esc(o)}</span></button>`);
        b.onclick=()=>{
          if(box.dataset.done)return;box.dataset.done=1;
          const ok=o===q.ans;
          [...opts.children].forEach((c,j)=>{c.disabled=true;if(order[j]===q.ans)c.classList.add('ok')});
          if(!ok)b.classList.add('bad');
          done(ok,`<span>${esc(q.ex||'')}</span>`);
        };
        opts.appendChild(b);
      });
    } else if(q.kind==='type'){
      box.appendChild(el(`<div class="qprompt zh">${esc(q.prompt)}</div>`));
      const inp=el('<input type="text" inputmode="numeric" autocomplete="off" aria-label="Your answer" style="font-family:var(--ui)">');box.appendChild(inp);
      const nav=el('<div class="qnav"><button class="btn">Check</button></div>');box.appendChild(nav);
      const chk=()=>{if(box.dataset.done)return;box.dataset.done=1;nav.remove();inp.disabled=true;const ok=inp.value.replace(/[,\s]/g,'')===q.ans;done(ok,`<span>${esc(q.ex)}</span>`)};
      $('button',nav).onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();chk()}};setTimeout(()=>inp.focus(),30);
    } else if(q.kind==='order'){
      box.appendChild(el(`<div class="qprompt">${esc(q.en)}</div>`));
      box.appendChild(el(`<div class="qctx">Tap the pieces in order to build the sentence.</div>`));
      const pre=q.pre&&q.pre!=='。'?q.pre:'';const post=q.pre==='。'?'。':(q.pre?'。':'');
      const line=el(`<div class="slots"></div>`);
      const bank=el('<div class="bank"></div>');
      if(pre) line.appendChild(el(`<span class="pre">${esc(pre)}</span>`));
      box.appendChild(line);box.appendChild(bank);
      let chosen=[];
      let tiles=shuffle(q.chunks.map((c,k)=>({c,k})));
      if(tiles.map(t=>t.c).join('')===q.chunks.join('')&&tiles.length>1) tiles=tiles.reverse();
      const draw=()=>{
        [...line.querySelectorAll('.tile')].forEach(t=>t.remove());
        chosen.forEach((t,idx)=>{const b=el(`<button class="tile">${esc(t.c)}</button>`);b.onclick=()=>{if(box.dataset.done)return;chosen.splice(idx,1);draw()};line.appendChild(b)});
        bank.innerHTML='';
        tiles.forEach(t=>{const used=chosen.includes(t);const b=el(`<button class="tile ${used?'used':''}" ${used?'tabindex="-1" aria-hidden="true"':''}>${esc(t.c)}</button>`);b.onclick=()=>{if(box.dataset.done||used)return;chosen.push(t);draw()};bank.appendChild(b)});
        cb.disabled=chosen.length!==tiles.length;
      };
      const nav=el('<div class="qnav"><button class="btn ghost">Reset</button><button class="btn">Check</button></div>');box.appendChild(nav);
      const [rb,cb]=nav.querySelectorAll('button');
      rb.onclick=()=>{chosen=[];draw()};
      cb.onclick=()=>{
        if(box.dataset.done)return;box.dataset.done=1;nav.remove();
        const got=norm(chosen.map(t=>t.c).join(''));const want=[q.chunks,...q.alts].map(a=>norm(Array.isArray(a)?a.join(''):a));
        const ok=want.includes(got);line.classList.add(ok?'ok':'bad');bank.remove();
        done(ok,`<span class="zh">${esc(pre+q.chunks.join('')+post)}</span>`);
      };
      draw();
    } else if(q.kind==='trans'){
      box.appendChild(el(`<div class="qprompt">${esc(q.en)}</div>`));
      box.appendChild(el(`<div class="qctx">Translate into Chinese characters. Exact matches are graded automatically; otherwise compare with the model answer and grade yourself honestly.</div>`));
      const ta=el('<textarea aria-label="Your translation" lang="zh"></textarea>');box.appendChild(ta);
      const nav=el('<div class="qnav"><button class="btn ghost">Show answer</button><button class="btn">Check</button></div>');box.appendChild(nav);
      const [sb,cb]=nav.querySelectorAll('button');
      const reveal=()=>{
        if(box.dataset.done)return;box.dataset.done=1;nav.remove();ta.disabled=true;
        const got=norm(ta.value);const ok=got&&[q.model,...q.alts].some(m=>norm(m)===got);
        if(ok) return done(true,`<span class="zh">${esc(q.model)}</span>`);
        const m=el(`<div class="feedback" style="background:var(--gridbg)"><b>Model answer</b><span class="zh">${esc(q.model)}</span>${q.alts.length?`<div class="small muted" style="margin-top:4px">Also fine: <span class="hz">${q.alts.map(esc).join('　')}</span></div>`:''}<div class="row" style="margin-top:12px"><button class="btn">I had it right</button><button class="btn ghost">I missed it</button></div></div>`);
        box.appendChild(m);const [y,n]=m.querySelectorAll('button');
        y.onclick=()=>{m.querySelector('.row').remove();done(true,'')};n.onclick=()=>{m.querySelector('.row').remove();done(false,'')};
      };
      sb.onclick=reveal;cb.onclick=reveal;setTimeout(()=>ta.focus(),30);
    }
  }
  function finish(){
    wrap.innerHTML='';
    const pct=items.length?Math.round(score/items.length*100):0;
    const byL={};results.forEach(r=>{const k=r.q.L;byL[k]=byL[k]||{a:0,c:0};byL[k].a++;if(r.ok)byL[k].c++});
    const box=el(`<div class="qwrap"><h2 style="margin-top:0">${score} / ${items.length} correct · ${pct}%</h2>
      <div>${Object.keys(byL).sort().map(k=>`<div class="bar"><span class="lbl">${LNAME[k]}</span><span class="track"><i style="width:${byL[k].c/byL[k].a*100}%"></i></span><span class="val">${byL[k].c}/${byL[k].a}</span></div>`).join('')}</div>
      <div class="row" style="margin:16px 0 4px"><button class="btn" data-a="again">Try another set</button>${results.some(r=>!r.ok)?'<button class="btn ghost" data-a="miss">Retry the ones I missed</button>':''}</div></div>`);
    const missed=results.filter(r=>!r.ok);
    if(missed.length){
      box.appendChild(el('<h3 style="margin-top:20px">Review your misses</h3>'));
      const ul=el('<ul class="summary-list"></ul>');
      missed.forEach(r=>ul.appendChild(el(`<li>${qPreview(r.q)}</li>`)));box.appendChild(ul);
    }
    wrap.appendChild(box);
    box.querySelector('[data-a="again"]').onclick=()=>opt.again?opt.again():runQuiz(host,shuffle(items),opt);
    const mb=box.querySelector('[data-a="miss"]');if(mb)mb.onclick=()=>runQuiz(host,shuffle(missed.map(r=>r.q)),{...opt,title:'Missed'});
    host.scrollIntoView({block:'start',behavior:'smooth'});
  }
  next();
}
function qPreview(q){
  if(q.kind==='mc'||q.kind==='type') return `<div class="${hasHan(q.prompt)?'zh':''}">${blankify(q.prompt)}</div><div class="small">Answer: <span class="${hasHan(q.ans)?'hz':''}">${esc(q.kind==='type'?fmt(+q.ans):q.ans)}</span>${q.ex?' — '+esc(q.ex):''}</div>`;
  if(q.kind==='order') return `<div>${esc(q.en)}</div><div class="zh">${esc((q.pre&&q.pre!=='。'?q.pre:'')+q.chunks.join(''))}</div>`;
  return `<div>${esc(q.en)}</div><div class="zh">${esc(q.model)}</div>`;
}

  function build(){
    body.innerHTML='';const p=pool();
    if(!p.length){body.innerHTML='<div class="empty">No ★ words in this lesson. Choose L16 or L17, or turn off “★ only”.</div>';return}
    if(mode==='list'){
      const t=el('<table class="vlist"></table>');
      p.forEach(v=>t.appendChild(el(`<tr><td class="h">${esc(v.h)} ${v.star===1?'<span class="badge star">★</span>':v.star===2?'<span class="badge">☆</span>':''}</td><td class="p">${esc(v.p)}</td><td>${esc(v.e)}</td><td class="muted small">L${v.L}</td></tr>`)));
      body.appendChild(t);return}
    if(mode==='quiz'){
      const setup=el(`<div class="panel"><h3>Quiz type</h3><div class="row" style="margin:10px 0 14px">
        <button class="chip" data-m="h2e" aria-pressed="true">Chinese → English</button><button class="chip" data-m="e2h" aria-pressed="false">English → Chinese</button><button class="chip" data-m="h2p" aria-pressed="false">Chinese → pinyin</button><button class="chip" data-m="mix" aria-pressed="false">Mixed</button></div>
        <button class="btn">Start ${Math.min(20,p.length)} questions</button></div>`);
      let qm='h2e';setup.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{qm=b.dataset.m;setup.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
      $('.btn',setup).onclick=()=>{const big=VOCAB.filter(v=>L==='all'||v.L==L);const mk=()=>pick(p,20).map(v=>vocabQ(v,qm==='mix'?['h2e','e2h','h2p'][Math.floor(Math.random()*3)]:qm,big.length>=4?big:VOCAB));runQuiz(body,mk(),{title:'Vocabulary',again:()=>runQuiz(body,mk(),{title:'Vocabulary'})})};
      body.appendChild(setup);return}
    deck=shuffle(p.filter(v=>!hideKnown||!KNOWN.has(v.id)));idx=0;card();
  }
  function card(){
    body.innerHTML='';
    const ctrl=el(`<div class="row" style="justify-content:space-between"><div class="row"><button class="chip" data-d aria-pressed="${dir==='en'}">English first</button><button class="chip" data-k aria-pressed="${hideKnown}">Hide known</button></div><span class="muted small">${deck.length?idx+1:0} / ${deck.length}</span></div>`);
    body.appendChild(ctrl);
    $('[data-d]',ctrl).onclick=()=>{dir=dir==='zh'?'en':'zh';card()};
    $('[data-k]',ctrl).onclick=()=>{hideKnown=!hideKnown;build()};
    if(!deck.length){body.appendChild(el('<div class="empty" style="margin-top:12px">You\u2019ve marked every card here as known. Turn off “Hide known” to review them again.</div>'));return}
    if(idx>=deck.length){body.appendChild(el(`<div class="empty" style="margin-top:12px">Deck finished. ${deck.filter(v=>KNOWN.has(v.id)).length} of ${deck.length} marked known.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn">Shuffle and go again</button></div></div>`));$('.btn',body).onclick=build;return}
    const v=deck[idx];
    const front=dir==='zh'?`<div class="big">${esc(v.h)}</div>`:`<div class="en" style="font-size:26px;color:var(--ink)">${esc(v.e)}</div>`;
    const back=`<div class="big">${esc(v.h)}</div><div class="py">${esc(v.p)}</div><div class="en">${esc(v.e)}</div>`;
    const f=el(`<div class="fc"><div class="fc-in" tabindex="0" role="button" aria-label="Flip card"><div class="fc-face">${front}<div style="margin-top:14px"><span class="badge">${LNAME[v.L]}</span> ${v.star===1?'<span class="badge star">★ handwrite</span>':''}</div><div class="muted small" style="margin-top:12px">Tap or press space to flip</div></div><div class="fc-face fc-back">${back}</div></div></div>`);
    body.appendChild(f);const inner=$('.fc-in',f);
    const flip=()=>f.classList.toggle('flip');inner.onclick=flip;inner.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
    const btns=el(`<div class="row" style="justify-content:center"><button class="btn ghost" data-a="0">Still learning</button><button class="btn" data-a="1">I know it</button></div>`);
    body.appendChild(btns);
    btns.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.a==='1')KNOWN.add(v.id);else KNOWN.delete(v.id);store.set('ic19-known',[...KNOWN]);idx++;card()});
    inner.focus({preventScroll:true});
  }
  chips();build();
},

writing(m){
  let mode='words',src='star',L=17,list=[],i=0;
  m.innerHTML=`<h1>写字 Handwriting</h1><p class="lead">Part VI is handwritten translation. Write each word from memory in the grid with your finger, stylus, or mouse, then reveal to compare stroke shapes.</p>
  <div class="row" id="wm" style="margin-bottom:16px"></div><div id="wb"></div>`;
  const wm=$('#wm',m),wb=$('#wb',m);
  function chips(){
    wm.innerHTML='';
    [['words','Write words'],['sent','Sentence translation']].forEach(([k,t])=>{const b=el(`<button class="chip" aria-pressed="${mode===k}">${t}</button>`);b.onclick=()=>{mode=k;chips();start()};wm.appendChild(b)});
    if(mode==='words'){
      [['star','★ words'],['16','All L16'],['17','All L17'],['18','All L18'],['19','All L19']].forEach(([k,t])=>{const b=el(`<button class="chip" aria-pressed="${src===k}">${t}</button>`);b.onclick=()=>{src=k;chips();start()};wm.appendChild(b)});
    }
  }
  function start(){
    i=0;
    if(mode==='sent'){list=shuffle(HWS);return sent()}
    list=src==='star'?shuffle(HW):shuffle(VOCAB.filter(v=>v.L==+src).map(v=>({h:v.h.split(/[／/]/)[0].replace(/[^\u4e00-\u9fff]/g,''),p:v.p,e:v.e})).filter(v=>v.h.length&&v.h.length<=5));
    word();
  }
  function word(){
    wb.innerHTML='';
    if(i>=list.length){wb.innerHTML='<div class="empty">Set complete.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn">Go again</button></div></div>';$('.btn',wb).onclick=start;return}
    const w=list[i];const n=w.h.length;
    const box=el(`<div class="panel"><div class="qmeta"><span>${i+1} / ${list.length}</span></div><div class="qprompt">${esc(w.e)}</div><div class="muted">${esc(w.p)}</div><div class="canvaswrap"><canvas></canvas><div class="overlay" hidden></div></div><div class="row"><button class="btn ghost" data-a="clear">Clear</button><button class="btn ghost" data-a="show">Reveal</button><button class="btn" data-a="next">Next word</button></div></div>`);
    wb.appendChild(box);
    const avail=Math.min(box.clientWidth-46,620);const size=Math.max(56,Math.min(130,Math.floor(avail/n)));
    const cv=$('canvas',box),ov=$('.overlay',box);setupCanvas(cv,size,n);
    ov.innerHTML=w.h.split('').map(c=>`<span style="width:${size}px;height:${size}px;font-size:${size*.78}px">${esc(c)}</span>`).join('');
    box.querySelector('[data-a="clear"]').onclick=()=>setupCanvas(cv,size,n,true);
    box.querySelector('[data-a="show"]').onclick=e=>{ov.hidden=!ov.hidden;e.target.textContent=ov.hidden?'Reveal':'Hide'};
    box.querySelector('[data-a="next"]').onclick=()=>{i++;word()};
  }
  function sent(){
    wb.innerHTML='';
    if(i>=list.length){wb.innerHTML='<div class="empty">All sentences done.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn">Go again</button></div></div>';$('.btn',wb).onclick=start;return}
    const [en,zh]=list[i];
    const box=el(`<div class="panel"><div class="qmeta"><span>${i+1} / ${list.length}</span></div><div class="qprompt">${esc(en)}</div><p class="muted">Write the Chinese on paper by hand, then reveal the model answer.</p><div class="feedback" style="background:var(--gridbg)" hidden><b>Model answer</b><span class="hz" style="font-size:24px">${esc(zh)}</span></div><div class="row" style="margin-top:14px"><button class="btn ghost">Reveal answer</button><button class="btn">Next sentence</button></div></div>`);
    wb.appendChild(box);const [rv,nx]=box.querySelectorAll('.row button');
    rv.onclick=()=>{$('.feedback',box).hidden=false};nx.onclick=()=>{i++;sent()};
  }
  chips();start();
}

/* ================= CANVAS ================= */
function setupCanvas(cv,size,n,clearOnly){
  const dpr=window.devicePixelRatio||1,W=size*n,H=size;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const grid=cs.getPropertyValue('--grid').trim(),gf=cs.getPropertyValue('--gridf').trim(),card=cs.getPropertyValue('--card').trim(),ink=cs.getPropertyValue('--ink').trim();
  ctx.fillStyle=card;ctx.fillRect(0,0,W,H);
  for(let k=0;k<n;k++){const x=k*size;
    ctx.strokeStyle=gf;ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();
    ctx.moveTo(x+size/2,0);ctx.lineTo(x+size/2,H);ctx.moveTo(x,H/2);ctx.lineTo(x+size,H/2);
    ctx.moveTo(x,0);ctx.lineTo(x+size,H);ctx.moveTo(x+size,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=grid;ctx.lineWidth=1.5;ctx.strokeRect(x+.75,.75,size-1.5,H-1.5)}
  if(clearOnly)return;
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);const c=cv.getContext('2d');c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();c.lineWidth=Math.max(3,size*.055);c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(last.x,last.y);c.lineTo(p.x,p.y);c.stroke();last=p;e.preventDefault()};
  const end=()=>{drawing=false};cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end;
}
